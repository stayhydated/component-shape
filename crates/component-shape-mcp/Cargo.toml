[package]
name = "component-shape-mcp"
description = """
Shared MCP protocol and schema helpers for component-shape integrations.
"""
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
chrono = [ "dep:chrono" ]
default = [ "derive" ]
derive = [ "dep:component-shape-mcp-macros" ]
rust_decimal = [ "dep:rust_decimal" ]

[dependencies]
chrono = { optional = true, workspace = true }
component-shape = { workspace = true }
component-shape-mcp-macros = { optional = true, workspace = true }
jsonschema = { workspace = true }
koruma-core = { workspace = true }
rmcp = { workspace = true }
rust_decimal = { optional = true, workspace = true }
serde = { features = [ "derive" ], workspace = true }
serde_json = { workspace = true }
strum = { features = [ "derive" ], workspace = true }
thiserror = { workspace = true }
tokio = { features = [ "rt-multi-thread" ], workspace = true }

[dev-dependencies]
koruma = { workspace = true }
koruma-collection = { workspace = true }
criterion = { default-features = false, features = [
  "async_tokio",
  "cargo_bench_support",
], version = "0.8.2" }
proptest = { default-features = false, features = [ "std" ], version = "1.11" }
rmcp = { features = [ "client" ], workspace = true }

[[bench]]
harness = false
name = "output_validation"

[lints]
workspace = true
