[workspace]
members = [
  "crates/component-shape",
  "crates/component-shape-codegen",
  "crates/component-shape-gpui",
  "crates/component-shape-gpui-macros",
  "crates/component-shape-mcp",
  "crates/component-shape-mcp-macros",
  "web",
  "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = true
repository = "https://github.com/stayhydated/component-shape"
rust-version = "1.99"
version = "0.3.4"

[workspace.dependencies]
anyhow = "1.0.104"
attribute-dsl = "0.2.3"
chrono = "0.4.45"
clap = "4.6.7"
component-shape = { path = "crates/component-shape", version = "0.3.4" }
component-shape-codegen = { path = "crates/component-shape-codegen", version = "0.3.4" }
component-shape-gpui = { path = "crates/component-shape-gpui", version = "0.3.4" }
component-shape-gpui-macros = { path = "crates/component-shape-gpui-macros", version = "0.3.4" }
component-shape-mcp = { path = "crates/component-shape-mcp", version = "0.3.4" }
component-shape-mcp-macros = { path = "crates/component-shape-mcp-macros", version = "0.3.4" }
derive_more = "2.1.1"
dioxus = { default-features = false, version = "0.7.10" }
gpui-kit = "0.8.0"
heck = "0.5.0"
jsonschema = { default-features = false, version = "0.60.1" }
koruma = "0.13.1"
koruma-collection = "0.13.1"
koruma-core = { default-features = false, version = "0.13.1" }
prettyplease = "0.3.0"
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
rmcp = { default-features = false, features = [ "server", "transport-io" ], version = "3.7.0" }
rust_decimal = "1.43.0"
serde = "1.0.229"
serde_json = "1.0.154"
stayhydated-dioxus = { git = "https://github.com/stayhydated/shared", rev = "b3f91071b4e61702a63f57844560f70bbc9bf623" }
stayhydated-site = { git = "https://github.com/stayhydated/shared", rev = "b3f91071b4e61702a63f57844560f70bbc9bf623" }
stayhydated-xtask = { git = "https://github.com/stayhydated/shared", rev = "b3f91071b4e61702a63f57844560f70bbc9bf623" }
strum = "0.28.0"
syn = { default-features = false, version = "3.0.9" }
thiserror = "2.0.21"
tokio = "1.54.1"
trybuild = "1.0.122"
web = { path = "web" }

[profile.dev]
codegen-units = 16
debug = "limited"
opt-level = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[workspace.lints.rust]
future_incompatible = "deny"
nonstandard_style = "deny"
unexpected_cfgs = { check-cfg = [ "cfg(coverage)" ], level = "deny" }
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
derive_partial_eq_without_eq = "warn"
err_expect = "warn"
incompatible_msrv = "deny"
iter_on_single_items = "warn"
needless_bool = "warn"
redundant_clone = "warn"
todo = "deny"
type_complexity = "allow"
uninlined_format_args = "allow"
unused_trait_names = "warn"
useless_conversion = "warn"
