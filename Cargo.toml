[workspace]
members = [
  "crates/component-shape",
  "crates/component-shape-codegen",
  "crates/component-shape-gpui",
  "crates/component-shape-gpui-macros",
  "crates/component-shape-mcp",
  "crates/component-shape-mcp-macros",
  "web",
  "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = true
repository = "https://github.com/stayhydated/component-shape"
rust-version = "1.98"
version = "0.2.0"

[workspace.dependencies]
anyhow = "1.0"
attribute-dsl = { git = "https://github.com/stayhydated/attribute-dsl", rev = "503bebaa926e750005e80b03ee4a801052b79d47", version = "0.2.0" }
chrono = "0.4"
clap = "4.6"
component-shape = { path = "crates/component-shape", version = "0.2.0" }
component-shape-codegen = { path = "crates/component-shape-codegen", version = "0.2.0" }
component-shape-gpui = { path = "crates/component-shape-gpui", version = "0.2.0" }
component-shape-gpui-macros = { path = "crates/component-shape-gpui-macros", version = "0.2.0" }
component-shape-mcp = { path = "crates/component-shape-mcp", version = "0.2.0" }
component-shape-mcp-macros = { path = "crates/component-shape-mcp-macros", version = "0.2.0" }
derive_more = "2.1"
dioxus = { default-features = false, version = "0.7" }
gpui = { branch = "linux-headless-renderer", git = "https://github.com/stayhydated/zed", version = "0.2.2" }
heck = "0.5"
prettyplease = "0.3"
proc-macro-crate = "3.5"
proc-macro2 = "1.0"
quote = "1.0"
rmcp = { default-features = false, features = [ "server", "transport-io" ], version = "3.1" }
rust_decimal = "1.42"
serde = "1.0"
serde_json = "1.0"
stayhydated-dioxus = { git = "https://github.com/stayhydated/shared", rev = "809946144fe13b04a57ba17677c4c699143f4786" }
stayhydated-site = { git = "https://github.com/stayhydated/shared", rev = "809946144fe13b04a57ba17677c4c699143f4786" }
stayhydated-xtask = { git = "https://github.com/stayhydated/shared", rev = "809946144fe13b04a57ba17677c4c699143f4786" }
strum = "0.28"
syn = { default-features = false, version = "3.0" }
thiserror = "2.0"
tokio = "1.53"
trybuild = "1.0"
web = { path = "web" }

[profile.dev]
codegen-units = 16
debug = "limited"
opt-level = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[workspace.lints.rust]
future_incompatible = "deny"
nonstandard_style = "deny"
unexpected_cfgs = { check-cfg = [ "cfg(coverage)" ], level = "deny" }
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
derive_partial_eq_without_eq = "warn"
err_expect = "warn"
incompatible_msrv = "deny"
iter_on_single_items = "warn"
needless_bool = "warn"
redundant_clone = "warn"
todo = "deny"
type_complexity = "allow"
uninlined_format_args = "allow"
unused_trait_names = "warn"
useless_conversion = "warn"
